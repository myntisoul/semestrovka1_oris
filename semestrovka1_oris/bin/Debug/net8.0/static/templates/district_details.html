<div class="district-details">
    <img src="${district.ImageURL}">
    <h2>${district.Name}</h2>
    <p><b>Цвет</b>: ${district.Color}</p>
    <p>${bonusText.Text}</p>
    <p><b>Стоимость</b>: ${district.Cost}</p>
    <p><b>Количество карт в стопке: ${district.Quantity}</b></p>
    <p>${district.Description}</p>
    <a href="/wiki/districts">Назад к списку</a>
</div>
