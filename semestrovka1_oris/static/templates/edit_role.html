<h2>Редактирование роли</h2>
<div class="found">
    <form method="post" action="/admin/updaterole" enctype="multipart/form-data">
        <h4>Имя</h4>
        <input type="text" name="name" value="${role.Name}" placeholder="Имя роли">
        <h4>Описание</h4>
        <input type="text" name="description" value="${role.Description}" placeholder="Описание роли">
        <label for="turn-order">Очерёдность хода</label>
        <input type="number" id="turn-order" name="turnOrder" min="1" max="2147483647" step="1" value="${role.TurnOrder}" required>
        <h4>Изображение</h4>
        <input type="file" name="image" accept="image/png,image/jpeg,image/webp" placeholder="Карточка роли">
        <input type="hidden" name="id" value="${role.Id}">
        <button type="submit">Сохранить</button>
    </form>
</div>
