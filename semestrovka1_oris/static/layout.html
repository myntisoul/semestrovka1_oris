<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Цитадели Wiki</title>
        <link rel="stylesheet" href="/styles.css">
        <script src="/search.js" defer></script>
    </head>
    <body>
        <div class="header">
            <div class='main-content-header'>
                <img src="/images/logo.png">
                <h1>Цитадели Wiki</h1>
            </div>
            <form action="/wiki/search" method="get" class="search">
                <input type="text" placeholder="Поиск" name="q">
                <button type="submit" class="search-btn"><p>Найти</p></button>
            </form>
            <a href="/wiki/login"><div class="search-btn">Войти</div></a>
            <a href="/admin/adminpanel"><div class="search-btn">Админко</div></a>
        </div>
        <div class="main-content">
            <div class="menu">
                <h3>Меню</h3>
                <a href="/">Об игре</a>
                <a href="/wiki/rules">Правила игры</a>
                <a href="/wiki/roles">Карты ролей</a>
                <a href="/wiki/districts">Карты районов</a>
            </div>
            <div class="content-box">
                <p id="search-status" role="status" hidden></p>
                <div id="wiki-content">
                {{Content}}
                </div>
            </div>
        </div>
    </body>
</html>
